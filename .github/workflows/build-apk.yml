name: Build Lamsa Customer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Get dependencies
        working-directory: lamsa_customer
        run: flutter pub get

      - name: Build release APK
        working-directory: lamsa_customer
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lamsa-customer-apk
          path: lamsa_customer/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
